<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD CHAT PRO V3 STANDARD - Tonny Samuel</title>
<meta name="theme-color" content="#FF0000">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--bg:#0a0a0a;--card:#1a1a1a;--border:#2a2a2a;--text:#fff;--text2:#999;--red:#FF0000;--green:#00FF88}
[data-theme="light"]{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--text:#000;--text2:#666}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--card);border-bottom:2px solid var(--red);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo span{width:36px;height:36px;background:var(--red);border-radius:50%;display:grid;place-items:center}
.btn-icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer}
.online-badge{background:var(--green);color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.status-bar{background:var(--card);padding:8px 16px;font-size:13px;color:var(--text2);display:flex;justify-content:space-between;border-bottom:1px solid var(--border);align-items:center}
.verified{background:var(--green);color:#000;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.login-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:400px}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;font-weight:600}
.input-group input,.input-group select{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;outline:none}
.btn-primary{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;margin-top:6px}
.btn-secondary{width:100%;padding:12px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:12px;font-weight:600;margin-top:10px;cursor:pointer}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.message{max-width:78%;padding:12px 16px;border-radius:18px;word-wrap:break-word;font-size:14px}
.message.own{background:var(--red);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.message.other{background:var(--card);border:1px solid var(--border);margin-right:auto;border-bottom-left-radius:4px}
.message-info{font-size:10px;opacity:0.7;margin-top:6px;display:flex;justify-content:space-between}
.sender{font-weight:700;font-size:12px;margin-bottom:4px;color:var(--green)}
.composer{background:var(--card);border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.composer-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:12px 16px;min-height:48px;max-height:120px;resize:none;outline:none;color:var(--text);font-size:15px}
.btn-send{width:48px;height:48px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.config-banner{background:#FFAA00;color:#000;padding:10px 16px;font-size:12px;font-weight:700;text-align:center}
.lang-switch{font-size:11px;padding:4px 8px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
</style>
</head>
<body data-theme="dark">
<div class="config-banner" id="configBanner">LOCAL MODE - Connect Firebase to go ONLINE</div>
<div class="header">
<div class="logo"><span>🌍</span> WORLD CHAT PRO <small style="background:var(--red);padding:2px 6px;border-radius:6px;font-size:10px">V3 STANDARD</small></div>
<div style="display:flex;gap:8px;align-items:center">
<select class="lang-switch" id="langSelect" onchange="changeLang(this.value)">
<option value="en">English</option>
<option value="ny">Chichewa</option>
<option value="sw">Kiswahili</option>
<option value="fr">Français</option>
<option value="pt">Português</option>
</select>
<button class="btn-icon" onclick="toggleTheme()">🌓</button>
<div class="online-badge"><span id="onlineCount">1</span> Online</div>
</div>
</div>
<div class="status-bar"><span id="userStatus">✅ Tonny Samuel Verified! PRO Active!</span><span class="verified" id="modeStatus">LOCAL</span></div>
<div class="login-screen" id="loginScreen">
<div class="login-card">
<h2 id="t_title">Join World Chat</h2>
<p style="color:var(--text2);font-size:14px;margin:10px 0 20px" id="t_sub">Global Chat - Like WhatsApp - Built in Malawi 🇲🇼</p>
<div class="input-group"><label id="t_name">Your Name</label><input type="text" id="userName" value="Tonny Samuel"></div>
<div class="input-group"><label id="t_phone">Phone Number +265</label><input type="tel" id="userPhone" value="+265 992 925 267"></div>
<div class="input-group"><label id="t_lang">Preferred Language</label>
<select id="prefLang">
<option value="en">English (Default)</option>
<option value="ny">Chichewa</option>
<option value="sw">Kiswahili</option>
<option value="fr">Français</option>
<option value="pt">Português</option>
</select>
</div>
<button class="btn-primary" onclick="enterChat()" id="t_join">JOIN CHAT 🚀</button>
<button class="btn-secondary" onclick="enterChat()" id="t_guest">Continue as Guest</button>
</div>
</div>
<div class="messages" id="messages" style="display:none"></div>
<div class="composer" id="composer" style="display:none">
<button class="btn-icon" onclick="document.getElementById('fileInput').click()">📎</button>
<textarea class="composer-input" id="messageInput" placeholder="Type a message..." rows="1"></textarea>
<button class="btn-send" onclick="sendMessage()">➤</button>
<button class="btn-icon" onclick="document.getElementById('fileInput').click()">🖼️</button>
</div>
<input type="file" id="fileInput" accept="image/*,video/*" style="display:none">
<script>
const translations={en:{title:"Join World Chat",sub:"Global Chat - Like WhatsApp - Built in Malawi 🇲🇼",name:"Your Name",phone:"Phone Number +265",lang:"Preferred Language",join:"JOIN CHAT 🚀",guest:"Continue as Guest",placeholder:"Type a message...",status:"Verified! PRO Active!",botReply:"Hello BOSS! Received:"},ny:{title:"Lowani mu World Chat",sub:"Chat yapadziko lonse - Monga WhatsApp - Yopangidwa ku Malawi 🇲🇼",name:"Dzina Lanu",phone:"Nambala +265",lang:"Chilankhulo",join:"LOWANI MU CHAT 🚀",guest:"Pitirizani Monga Guest",placeholder:"Lembani uthenga...",status:"Wotsimikizika! PRO Active!",botReply:"Moni BOSS! Ndalandira:"},sw:{title:"Jiunge na World Chat",sub:"Chat ya Dunia - Kama WhatsApp - Imetengenezwa Malawi 🇲🇼",name:"Jina Lako",phone:"Namba +265",lang:"Lugha",join:"JIUNGE 🚀",guest:"Endelea kama Mgeni",placeholder:"Andika ujumbe...",status:"Imethibitishwa! PRO Active!",botReply:"Habari BOSS! Nimepokea:"},fr:{title:"Rejoindre World Chat",sub:"Chat Mondial - Comme WhatsApp - Fabriqué au Malawi 🇲🇼",name:"Votre Nom",phone:"Numéro +265",lang:"Langue",join:"REJOINDRE 🚀",guest:"Continuer en tant qu'invité",placeholder:"Tapez un message...",status:"Vérifié! PRO Active!",botReply:"Salut BOSS! Reçu:"},pt:{title:"Entrar no World Chat",sub:"Chat Global - Como WhatsApp - Feito no Malawi 🇲🇼",name:"Seu Nome",phone:"Número +265",lang:"Idioma",join:"ENTRAR 🚀",guest:"Continuar como Convidado",placeholder:"Digite uma mensagem...",status:"Verificado! PRO Active!",botReply:"Olá BOSS! Recebido:"}};
let currentLang=localStorage.getItem('wcp_lang')||'en';let currentUser={name:"Tonny Samuel",id:"local_"+Date.now()};let messagesLocal=JSON.parse(localStorage.getItem('wcp_v3')||'[]');
function applyLang(lang){currentLang=lang;const t=translations[lang]||translations.en;document.getElementById('t_title').textContent=t.title;document.getElementById('t_sub').textContent=t.sub;document.getElementById('t_name').textContent=t.name;document.getElementById('t_phone').textContent=t.phone;document.getElementById('t_lang').textContent=t.lang;document.getElementById('t_join').textContent=t.join;document.getElementById('t_guest').textContent=t.guest;document.getElementById('messageInput').placeholder=t.placeholder;document.getElementById('langSelect').value=lang;localStorage.setItem('wcp_lang',lang);}
window.changeLang=(v)=>{applyLang(v);document.getElementById('prefLang').value=v;};window.toggleTheme=()=>{const c=document.body.getAttribute('data-theme');document.body.setAttribute('data-theme',c==='dark'?'light':'dark');};
function render(text,sender,own,time){const div=document.createElement('div');div.className='message '+(own?'own':'other');div.innerHTML=(own?'':'<div class="sender">'+sender+'</div>')+'<div>'+text+'</div><div class="message-info"><span>'+(time||new Date().toLocaleTimeString())+'</span><span>'+(own?'✓✓':'')+'</span></div>';document.getElementById('messages').appendChild(div);}
function scrollToBottom(){const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;}
window.enterChat=()=>{const name=document.getElementById('userName').value.trim()||'Tonny Samuel';const phone=document.getElementById('userPhone').value.trim()||'+265992925267';const chosenLang=document.getElementById('prefLang').value||currentLang;applyLang(chosenLang);currentUser={name,phone,id:'local_'+Date.now()};document.getElementById('loginScreen').style.display='none';document.getElementById('messages').style.display='flex';document.getElementById('composer').style.display='flex';const t=translations[currentLang]||translations.en;document.getElementById('userStatus').textContent='✅ '+name+' '+t.status;document.getElementById('onlineCount').textContent=Math.floor(Math.random()*20)+1;messagesLocal.forEach(m=>render(m.text,m.sender,m.own,m.time));scrollToBottom();};
window.sendMessage=()=>{const input=document.getElementById('messageInput');const text=input.value.trim();if(!text)return;const time=new Date().toLocaleTimeString();const t=translations[currentLang]||translations.en;render(text,currentUser.name,true,time);messagesLocal.push({text,sender:currentUser.name,own:true,time});localStorage.setItem('wcp_v3',JSON.stringify(messagesLocal));setTimeout(()=>{render(t.botReply+" "+text,"World Bot",false,new Date().toLocaleTimeString());scrollToBottom();},700);input.value='';scrollToBottom();};
document.getElementById('messageInput').addEventListener('keypress',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
document.getElementById('fileInput').addEventListener('change',function(){const file=this.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{const div=document.createElement('div');div.className='message own';div.innerHTML='<img src="'+e.target.result+'" style="max-width:200px;border-radius:12px"><div class="message-info"><span>'+new Date().toLocaleTimeString()+'</span><span>✓✓</span></div>';document.getElementById('messages').appendChild(div);scrollToBottom();};reader.readAsDataURL(file);});
applyLang(currentLang);
</script>
</body>
</html>
